<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwapMeet ’76 — My Table</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../app.js"></script>
</head>

<body class="sm76-body">
  <header class="sm76-header">
    <div class="sm76-logo">
      <span class="sm76-logo-main">SwapMeet ’76</span>
      <span class="sm76-logo-sub">Pure Barter. No Cash. No Fees.</span>
    </div>

    <nav class="sm76-nav">
      <a href="home.html" class="sm76-nav-link">Stalls</a>
      <a href="walkaisle.html" class="sm76-nav-link">Walk the Aisle</a>
      <a href="marketmap.html" class="sm76-nav-link">Market Map</a>
      <a href="mytable.html" class="sm76-nav-link">My Table</a>
      <a href="events.html" class="sm76-nav-link">Events</a>
      <a href="profile.html" class="sm76-nav-link">Profile</a>
    </nav>
  </header>

  <main style="padding:24px;">
    <h2 class="sm76-section-title">My Table</h2>

    <div id="myItemsGrid"
         style="display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px;">
    </div>

    <div class="sm76-card" style="margin-top:20px;">
      <h3>Add Item to Your Table</h3>

      <label>Title</label>
      <input id="itemTitle" style="width:100%; margin-bottom:10px; padding:8px;">

      <label>Description</label>
      <textarea id="itemDescription" style="width:100%; margin-bottom:10px; padding:8px;"></textarea>

      <label>Condition</label>
      <input id="itemCondition" style="width:100%; margin-bottom:10px; padding:8px;">

      <label>Wants (comma separated)</label>
      <input id="itemWants" style="width:100%; margin-bottom:10px; padding:8px;">

      <button id="btnAddItem" class="sm76-btn sm76-btn-primary" style="width:100%; margin-top:10px;">
        Post Item
      </button>

      <p id="addItemMessage" style="margin-top:10px; color:#b3b3b3;"></p>
    </div>
  </main>

  <footer class="sm76-footer">
    <span>SwapMeet ’76 • Barter‑Only • Retro Flea‑Market Network</span>
  </footer>
</body>
</html>
