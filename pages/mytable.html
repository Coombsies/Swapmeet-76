<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwapMeet ’76 — My Table</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../app.js"></script>
</head>

<body class="sm76-body">

  <header class="sm76-header">
    <div class="sm76-logo">
      <span class="sm76-logo-main">SwapMeet ’76</span>
      <span class="sm76-logo-sub">Pure Barter. No Cash. No Fees.</span>
    </div>

    <nav class="sm76-nav">
      <a href="home.html" class="sm76-nav-link">Stalls</a>
      <a href="walkaisle.html" class="sm76-nav-link">Walk the Aisle</a>
      <a href="marketmap.html" class="sm76-nav-link">Market Map</a>
      <a href="mytable.html" class="sm76-nav-link">My Table</a>
      <a href="events.html" class="sm76-nav-link">Events</a>
      <a href="profile.html" class="sm76-nav-link">Profile</a>
    </nav>
  </header>

  <main style="padding: 24px;">

    <h2 class="sm76-section-title">My Table</h2>

    <!-- ADD ITEM BUTTON -->
    <div style="margin-bottom: 20px;">
      <button id="addItemBtn" class="sm76-btn sm76-btn-primary">
        Add Item to My Table
      </button>
    </div>

    <!-- ITEMS GRID -->
    <div id="itemsGrid" style="
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    "></div>

  </main>

  <footer class="sm76-footer">
    <span>SwapMeet ’76 • Barter‑Only • Retro Flea‑Market Network</span>
  </footer>

  <!-- My Table Logic -->
  <script type="module">
    import { supabase, addItem } from "../app.js";

    // TEMP: Ask user for table ID (later we automate)
    const tableId = prompt("Enter your table ID:");

    async function loadItems() {
      const { data, error } = await supabase
        .from("items")
        .select("*")
        .eq("table_id", tableId);

      if (error) {
        console.error(error);
        return;
      }

      const grid = document.getElementById("itemsGrid");
      grid.innerHTML = "";

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "sm76-card";
        card.innerHTML = `
          <img src="${item.image_url || '../assets/banners/map.png'}" 
               alt="Item" 
               style="width:100%; border-radius:6px; margin-bottom:10px;">
          <h3 style="margin:0 0 6px;">${item.title}</h3>
          <p style="color:#b3b3b3; margin:0 0 10px;">${item.description || ''}</p>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById("addItemBtn").onclick = async () => {
      const title = prompt("Item title:");
      const description = prompt("Item description:");
      const imageUrl = prompt("Image URL (optional):");

      const item = await addItem(tableId, title, description, imageUrl);
      alert(`Added item: ${item.title}`);

      loadItems();
    };

    loadItems();
  </script>

</body>
</html>
