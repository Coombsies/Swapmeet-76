<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwapMeet ’76 — Trade Inbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../app.js"></script>
</head>

<body class="sm76-body">

  <header class="sm76-header">
    <div class="sm76-logo">
      <span class="sm76-logo-main">SwapMeet ’76</span>
      <span class="sm76-logo-sub">Pure Barter. No Cash. No Fees.</span>
    </div>

    <nav class="sm76-nav">
      <a href="home.html" class="sm76-nav-link">Stalls</a>
      <a href="walkaisle.html" class="sm76-nav-link">Walk the Aisle</a>
      <a href="marketmap.html" class="sm76-nav-link">Market Map</a>
      <a href="mytable.html" class="sm76-nav-link">My Table</a>
      <a href="tradeinbox.html" class="sm76-nav-link">Trade Inbox</a>
      <a href="events.html" class="sm76-nav-link">Events</a>
      <a href="profile.html" class="sm76-nav-link">Profile</a>
    </nav>
  </header>

  <main style="padding: 24px;">

    <h2 class="sm76-section-title">Trade Inbox</h2>

    <p style="color:#b3b3b3; margin-bottom: 20px;">
      These are the trade offers other users have sent for your items.
    </p>

    <!-- TRADES GRID -->
    <div id="tradesGrid" style="
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    "></div>

  </main>

  <footer class="sm76-footer">
    <span>SwapMeet ’76 • Barter‑Only • Retro Flea‑Market Network</span>
  </footer>

  <!-- Trade Inbox Logic -->
  <script type="module">
    import { supabase } from "../app.js";

    // TEMP: Ask user for their table ID
    const yourTableId = prompt("Enter YOUR table ID:");

    async function loadTrades() {
      // Step 1: Get all items YOU own
      const { data: yourItems, error: itemsError } = await supabase
        .from("items")
        .select("id")
        .eq("table_id", yourTableId);

      if (itemsError) {
        console.error(itemsError);
        return;
      }

      const yourItemIds = yourItems.map(i => i.id);

      // Step 2: Load trades where item_id is one of your items
      const { data: trades, error: tradesError } = await supabase
        .from("trades")
        .select("*")
        .in("item_id", yourItemIds);

      if (tradesError) {
        console.error(tradesError);
        return;
      }

      const grid = document.getElementById("tradesGrid");
      grid.innerHTML = "";

      for (const trade of trades) {
        // Load requested item
        const { data: requestedItem } = await supabase
          .from("items")
          .select("*")
          .eq("id", trade.item_id)
          .single();

        // Load offered item
        const { data: offeredItem } = await supabase
          .from("items")
          .select("*")
          .eq("id", trade.offered_item_id)
          .single();

        const card = document.createElement("div");
        card.className = "sm76-card";

        card.innerHTML = `
          <h3>Trade Offer</h3>

          <p style="color:#b3b3b3;">Status: ${trade.status}</p>

          <h4>You Own:</h4>
          <img src="${requestedItem.image_url || '../assets/banners/map.png'}"
               style="width:100%; border-radius:6px; margin-bottom:10px;">
          <strong>${requestedItem.title}</strong>
          <p>${requestedItem.description || ''}</p>

          <h4>They Offer:</h4>
          <img src="${offeredItem.image_url || '../assets/banners/map.png'}"
               style="width:100%; border-radius:6px; margin-bottom:10px;">
          <strong>${offeredItem.title}</strong>
          <p>${offeredItem.description || ''}</p>

          <div style="margin-top: 15px;">
            <button class="sm76-btn sm76-btn-primary" id="accept-${trade.id}">
              Accept Trade
            </button>
            <button class="sm76-btn sm76-btn-outline" id="decline-${trade.id}">
              Decline Trade
            </button>
          </div>
        `;

        grid.appendChild(card);

        // Accept button
        document.getElementById(`accept-${trade.id}`).onclick = async () => {
          await supabase
            .from("trades")
            .update({ status: "accepted" })
            .eq("id", trade.id);

          alert("Trade accepted!");
          loadTrades();
        };

        // Decline button
        document.getElementById(`decline-${trade.id}`).onclick = async () => {
          await supabase
            .from("trades")
            .update({ status: "declined" })
            .eq("id", trade.id);

          alert("Trade declined.");
          loadTrades();
        };
      }
    }

    loadTrades();
  </script>

</body>
</html>
