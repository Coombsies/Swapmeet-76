<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwapMeet ’76 — Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../app.js"></script>
</head>

<body class="sm76-body">
  <header class="sm76-header">
    <div class="sm76-logo">
      <span class="sm76-logo-main">SwapMeet ’76</span>
      <span class="sm76-logo-sub">Pure Barter. No Cash. No Fees.</span>
    </div>

    <nav class="sm76-nav">
      <a href="home.html" class="sm76-nav-link">Stalls</a>
      <a href="walkaisle.html" class="sm76-nav-link">Walk the Aisle</a>
      <a href="marketmap.html" class="sm76-nav-link">Market Map</a>
      <a href="mytable.html" class="sm76-nav-link">My Table</a>
      <a href="events.html" class="sm76-nav-link">Events</a>
      <a href="profile.html" class="sm76-nav-link">Profile</a>
    </nav>
  </header>

  <main style="padding:24px; max-width:640px; margin:0 auto;">
    <h2 class="sm76-section-title">Your Profile</h2>

    <div id="profileRoot" class="sm76-card">
      <p id="profileStatus" style="color:#b3b3b3; margin-bottom:12px;">
        Checking your session…
      </p>

      <div id="profileContent" style="display:none;">
        <p><strong>Email:</strong> <span id="profileEmail"></span></p>
        <p><strong>User ID:</strong> <span id="profileId"></span></p>

        <button id="btnLogout" class="sm76-btn sm76-btn-outline" style="margin-top:12px;">
          Log Out
        </button>
      </div>

      <div id="profileNoUser" style="display:none;">
        <p style="color:#b3b3b3;">
          You’re not signed in.  
          <a href="auth.html" style="color:#d96b2b;">Go to Sign In / Sign Up</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="sm76-footer">
    <span>SwapMeet ’76 • Barter‑Only • Retro Flea‑Market Network</span>
  </footer>
</body>
</html>
