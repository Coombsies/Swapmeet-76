<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwapMeet ’76 — Walk the Aisle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../app.js"></script>
</head>

<body class="sm76-body">

  <header class="sm76-header">
    <div class="sm76-logo">
      <span class="sm76-logo-main">SwapMeet ’76</span>
      <span class="sm76-logo-sub">Pure Barter. No Cash. No Fees.</span>
    </div>

    <nav class="sm76-nav">
      <a href="home.html" class="sm76-nav-link">Stalls</a>
      <a href="walkaisle.html" class="sm76-nav-link">Walk the Aisle</a>
      <a href="marketmap.html" class="sm76-nav-link">Market Map</a>
      <a href="mytable.html" class="sm76-nav-link">My Table</a>
      <a href="events.html" class="sm76-nav-link">Events</a>
      <a href="profile.html" class="sm76-nav-link">Profile</a>
    </nav>
  </header>

  <main style="padding: 24px;">

    <h2 class="sm76-section-title">Walk the Aisle</h2>
    <p style="color:#b3b3b3; margin-bottom: 20px;">
      Browse every table in the SwapMeet. Click a stall to see what’s on the table.
    </p>

    <!-- TABLES GRID -->
    <div id="tablesGrid" style="
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    "></div>

  </main>

  <footer class="sm76-footer">
    <span>SwapMeet ’76 • Barter‑Only • Retro Flea‑Market Network</span>
  </footer>

  <!-- Walk the Aisle Logic -->
  <script type="module">
    import { supabase } from "../app.js";

    async function loadTables() {
      const { data, error } = await supabase
        .from("swap_tables")
        .select("*");

      if (error) {
        console.error(error);
        return;
      }

      const grid = document.getElementById("tablesGrid");
      grid.innerHTML = "";

      data.forEach(table => {
        const card = document.createElement("div");
        card.className = "sm76-card";
        card.style.cursor = "pointer";

        card.innerHTML = `
          <img src="../assets/banners/map.png"
               alt="Table Banner"
               style="width:100%; border-radius:6px; margin-bottom:10px;">
          <h3 style="margin:0 0 6px;">${table.name}</h3>
          <p style="color:#b3b3b3; margin:0 0 10px;">
            Stall ID: ${table.id}
          </p>
          <span class="sm76-pill">View Items</span>
        `;

        card.onclick = () => {
          // Later: open a table detail page
          alert(`Table ID: ${table.id}`);
        };

        grid.appendChild(card);
      });
    }

    loadTables();
  </script>

</body>
</html>
