<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SwapMeet ’76 — Sign In / Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../app.js"></script>
</head>

<body class="sm76-body">
  <header class="sm76-header">
    <div class="sm76-logo">
      <span class="sm76-logo-main">SwapMeet ’76</span>
      <span class="sm76-logo-sub">Pure Barter. No Cash. No Fees.</span>
    </div>

    <nav class="sm76-nav">
      <a href="home.html" class="sm76-nav-link">Stalls</a>
      <a href="walkaisle.html" class="sm76-nav-link">Walk the Aisle</a>
      <a href="marketmap.html" class="sm76-nav-link">Market Map</a>
      <a href="mytable.html" class="sm76-nav-link">My Table</a>
      <a href="events.html" class="sm76-nav-link">Events</a>
      <a href="profile.html" class="sm76-nav-link">Profile</a>
    </nav>
  </header>

  <main style="padding:24px; max-width:420px; margin:0 auto;">
    <h2 class="sm76-section-title">Sign In / Sign Up</h2>

    <div class="sm76-card">
      <label>Email</label>
      <input id="authEmail" type="email" style="width:100%; margin-bottom:10px; padding:8px;">

      <label>Password</label>
      <input id="authPassword" type="password" style="width:100%; margin-bottom:16px; padding:8px;">

      <button id="btnSignIn" class="sm76-btn sm76-btn-primary" style="width:100%; margin-bottom:8px;">
        Sign In
      </button>

      <button id="btnSignUp" class="sm76-btn sm76-btn-outline" style="width:100%;">
        Create Account
      </button>

      <p id="authMessage" style="margin-top:12px; color:#b3b3b3;"></p>
    </div>
  </main>

  <footer class="sm76-footer">
    <span>SwapMeet ’76 • Barter‑Only • Retro Flea‑Market Network</span>
  </footer>
</body>
</html>
